[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: the formatter wraps code; long prompt strings and test data are fine.
# UP046: typing.Generic[T] is kept so the code reads the same on every supported Python.
ignore = ["E501", "UP046"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is written as a default argument.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
