    - generic [ref=f1e29]: We run an online food ordering and delivery platform in India, and we also sell restaurant software and ad products to restaurants. Our last big deal was a multi-city restaurant chain that signed up for our ads and POS bundle because of the order volume we could send them.
    - generic [ref=f1e30]: That's a clear B2B win. To help define your ideal restaurant partner for these software and ad bundles, do you find that multi-city chains are your best fit, or do you also see strong, high-value deals with independent, high-volume restaurants?
    - generic [ref=f1e31]: Mostly mid-size and large chains with 10 or more outlets. Independents are lots of small deals and churn quickly, so they are not our focus.
    - generic [ref=f1e33]: Chasing high-churn accounts often drains resources, so prioritizing scale is a strategic move. When you are pitching these larger groups, who is the primary person you deal with to get the contract signed?
    - generic [ref=f1e34]: Usually the head of marketing or the operations head of the chain. For the POS part, the CTO or an IT manager also gets involved, and the founder signs off for smaller chains.
    - generic [ref=f1e36]: Managing different stakeholders for ads versus software is a smart way to align your pitch with their specific priorities. When these chains finally decide to switch to your POS or buy your ad packages, what is the single biggest problem they are trying to solve?
    - generic [ref=f1e37]: For ads, they want more orders and visibility without paying huge commissions. For POS, the pain is juggling many order channels and billing errors across outlets.
    - generic [ref=f1e38]: Do you typically look for restaurant chains with a specific annual revenue range, or is the number of outlets the primary indicator of a good fit for you?
